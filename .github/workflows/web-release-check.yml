name: Check Web Release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-release:
    name: Check Release Gate
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        timeout-minutes: 5
        run: python -m pip install uv

      - name: Install npm dependencies
        timeout-minutes: 15
        run: npm install

      - name: Check code style
        timeout-minutes: 5
        run: |
          uv sync --project services/ai --frozen --only-group dev
          npm run style:all

      - name: Validate shared contracts
        timeout-minutes: 10
        run: npm run check:contracts

      - name: Check Web types
        timeout-minutes: 10
        run: npm run check:web

      - name: Build Web production bundle
        timeout-minutes: 15
        run: npm run build:web

      - name: Check Web bundle budget
        timeout-minutes: 10
        run: |
          npm --workspace @vibe-learner/web run start -- --hostname 127.0.0.1 --port 3417 > /tmp/vibe-web-bundle.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3417/ > /dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              cat /tmp/vibe-web-bundle.log
              exit 1
            fi
            sleep 1
          done
          npm run bench:web-bundle -- --base-url http://127.0.0.1:3417 --baseline docs/performance/web-bundle-v1.json
