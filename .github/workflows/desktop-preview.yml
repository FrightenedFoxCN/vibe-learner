name: Desktop Preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".node-version"
      - ".github/workflows/desktop-preview.yml"
      - ".github/workflows/desktop-build.yml"
      - "apps/desktop/**"
      - "apps/web/**"
      - "services/ai/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - "docs/desktop-packaging.md"

permissions:
  contents: read

jobs:
  build-preview:
    name: Build Desktop Preview
    uses: ./.github/workflows/desktop-build.yml
    with:
      artifact-suffix: preview
