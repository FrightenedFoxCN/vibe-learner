name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate Release Candidate
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tag and version alignment
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow from a tag ref like vX.Y.Z."
            exit 1
          fi
          python scripts/release/validate.py versions --tag="$GITHUB_REF_NAME"

      - name: Require successful desktop preflight for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release/validate.py preflight "$GITHUB_REPOSITORY" "$(git rev-parse HEAD)"

  check-release:
    name: Check Release Gate
    needs: validate-version
    uses: ./.github/workflows/web-release-check.yml

  build-release:
    name: Build Desktop Release
    needs: check-release
    uses: ./.github/workflows/desktop-build.yml
    with:
      artifact-suffix: release

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    needs:
      - validate-version
      - check-release
      - build-release

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: vibe-learner-*-release
          merge-multiple: true

      - name: Normalize release asset filenames
        working-directory: release-artifacts
        shell: bash
        run: |
          find . -maxdepth 1 -type f -name '* *' -print0 |
            while IFS= read -r -d '' asset; do
              normalized="${asset// /.}"
              if [ -e "$normalized" ]; then
                echo "::error::Cannot normalize $asset because $normalized already exists."
                exit 1
              fi
              mv -- "$asset" "$normalized"
            done

      - name: Generate checksums
        working-directory: release-artifacts
        run: |
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/release-SHA256SUMS.txt"
          cp "$RUNNER_TEMP/release-SHA256SUMS.txt" SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Vibe Learner ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-artifacts/*
