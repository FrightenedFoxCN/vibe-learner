name: Build Desktop Installers

on:
  workflow_call:
    inputs:
      artifact-suffix:
        description: Distinguishes preview, preflight, and release artifacts
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS DMG
            os: macos-15
            artifact_name: vibe-learner-macos-dmg
            artifact_path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows NSIS
            os: windows-latest
            artifact_name: vibe-learner-windows-nsis
            artifact_path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux AppImage
            os: ubuntu-22.04
            artifact_name: vibe-learner-linux-appimage
            artifact_path: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        run: python -m pip install uv

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm install

      - name: Build desktop installer
        run: npm run build:desktop

      - name: Verify macOS bundle signature
        if: runner.os == 'macOS'
        shell: bash
        run: bash apps/desktop/scripts/verify-macos-dmg.sh apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ inputs.artifact-suffix }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
