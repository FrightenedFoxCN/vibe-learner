[package]
name = "vibe-learner-desktop"
version = "0.3.3"
description = "Desktop shell for Vibe Learner"
edition = "2021"
rust-version = "1.89"

[lib]
name = "vibe_learner_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-stronghold = "2"
tauri-plugin-dialog = "2"

sha2 = "0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Stronghold's snapshot scrypt is prohibitively slow without optimization.
# Keep application debugging enabled and preserve all cryptographic parameters.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3
